# webapp/nginx.conf
# Nginx админ-панели (webapp/dist): отдаёт SPA и проксирует /api на backend
# внутри docker-сети (same-origin — иначе httpOnly cookie не сработают).

# X-Forwarded-Proto: пробрасываем значение вышестоящего прокси, если он его
# задал; иначе — схема текущего соединения. Backend использует заголовок для
# Secure-флага cookie админки (см. backend/src/admin/index.ts).
map $http_x_forwarded_proto $edem_fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: клиентские маршруты TanStack Router (/login, /users, ...)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Хешированные ассеты vite — кэшируем надолго.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API — на backend. URI не переписываем: /api/v1/... уходит как есть.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Перезаписываем, а не дополняем: левый (первый) хоп X-Forwarded-For
    # подделывается клиентом (см. backend/src/middleware/rateLimit.ts).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $edem_fwd_proto;
  }
}
