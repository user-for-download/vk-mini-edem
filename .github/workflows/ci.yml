name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
      JWT_SECRET: "dev-jwt-secret-key-32-chars-long-minimum-for-security"
      VK_APP_SECRET: "dev-vk-app-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate --schema backend/prisma/schema.prisma

      - name: Typecheck contracts
        run: npm run --workspace "@edem/contracts" build

      - name: Typecheck backend
        run: npm run --workspace backend typecheck

      - name: Typecheck mini-app
        run: npm run --workspace mini-app typecheck

      - name: Build mini-app
        run: npm run --workspace mini-app build

      - name: Contract tests
        run: npm run --workspace "@edem/contracts" test

      - name: Prepare backend test database
        run: npm run --workspace backend db:test:migrate

      - name: Backend smoke tests
        run: npm run --workspace backend test
