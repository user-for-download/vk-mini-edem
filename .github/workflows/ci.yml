name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate --schema backend/prisma/schema.prisma

      - name: Typecheck contracts
        run: npm run --workspace "@edem/contracts" build

      - name: Typecheck backend
        run: npm run --workspace backend typecheck

      - name: Typecheck mini-app
        run: npm run --workspace mini-app typecheck

      - name: Build mini-app
        run: npm run --workspace mini-app build

      - name: Contract tests
        run: npm run --workspace "@edem/contracts" test

      - name: Prepare backend test database
        run: npm run --workspace backend db:test:migrate

      - name: Backend smoke tests
        run: npm run --workspace backend test
