name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Append ?statement_cache_size=0 to disable Prisma's prepared statement caching
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edem_test?statement_cache_size=0
      JWT_SECRET: ci-jwt-secret
      VK_APP_SECRET: ci-vk-secret
      ALLOW_DEV_AUTH: "true"
      LOG_LEVEL: silent
      AUTH_RATE_WINDOW_MS: "900000"
      AUTH_RATE_MAX: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run --workspace "@edem/contracts" build

      - name: Prisma generate
        run: npm run --workspace backend db:generate

      - name: Prisma validate
        run: npm run --workspace backend prisma:validate

      - name: Apply Prisma migrations
        run: npm run --workspace backend db:migrate:deploy

      - name: Typecheck contracts
        run: npm run --workspace "@edem/contracts" typecheck

      - name: Typecheck backend
        run: npm run --workspace backend typecheck

      - name: Typecheck mini-app
        run: npm run --workspace mini-app typecheck

      - name: Build mini-app
        run: npm run --workspace mini-app build

      - name: Contract tests
        run: npm run --workspace "@edem/contracts" test

      - name: Backend smoke tests
        run: npm run --workspace backend test
