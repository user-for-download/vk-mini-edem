name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Append ?statement_cache_size=0 to disable Prisma's prepared statement caching
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edem_test?statement_cache_size=0
      JWT_SECRET: ci-jwt-secret
      VK_APP_SECRET: ci-vk-secret
      ALLOW_DEV_AUTH: "true"
      # E2E в CI не гоняется — не качать браузеры в postinstall (экономит минуты на npm ci).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # error (не silent): unhandled_error с кодом Prisma должен быть виден
      # в логах CI при редких флейках интеграционных тестов.
      LOG_LEVEL: error
      VK_AUTH_RATE_WINDOW_MS: "900000"
      VK_AUTH_RATE_MAX: "1000"
      REFRESH_RATE_WINDOW_MS: "900000"
      REFRESH_RATE_MAX: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: dist must not be tracked
        run: |
          TRACKED_DIST=$(git ls-files | grep -E '(^|/)dist/' || true)
          if [ -n "$TRACKED_DIST" ]; then echo "dist/ files are tracked: $TRACKED_DIST"; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Build contracts
        run: npm run --workspace "@edem/contracts" build

      - name: Prisma generate
        run: npm run --workspace backend db:generate

      - name: Prisma validate
        run: npm run --workspace backend prisma:validate

      - name: Push Prisma schema to DB
        run: npm run --workspace backend db:push

      - name: Lint and typecheck
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Contract tests
        run: npm run --workspace "@edem/contracts" test

      - name: Backend smoke tests
        run: npm run --workspace backend test

      - name: Mini-app tests
        run: npm run --workspace mini-app test

  # Замер скорости bun install vs npm ci — только измерение, прод-рантайм не трогаем.
  # Отдельная job на отдельном раннере: основную job checks не замедляет и не ломает.
  install-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Benchmark bun install (cold, no lockfile)
        run: |
          rm -f bun.lock bun.lockb
          /usr/bin/time -v bun install --no-progress 2>&1 | tail -20 || bun install --no-progress
          echo "--- node_modules size (bun) ---"
          du -sh node_modules

      - name: Benchmark npm ci (cold cache, for comparison)
        run: |
          rm -rf node_modules
          npm cache clean --force
          /usr/bin/time -v npm ci --no-audit --no-fund 2>&1 | tail -20 || npm ci --no-audit --no-fund
          echo "--- node_modules size (npm) ---"
          du -sh node_modules
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
